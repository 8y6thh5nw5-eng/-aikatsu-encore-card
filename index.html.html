<!doctype html><html lang="ja"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>アイカツ！アンコール 所持カード管理</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#fff7fb;color:#352b38;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif}
header{position:sticky;top:0;z-index:20;background:linear-gradient(135deg,#ff6aa6,#8d78df);color:#fff;padding:16px}h1{font-size:20px;margin:0}.sub{font-size:12px;margin-top:4px;opacity:.9}
main{max-width:1000px;margin:auto;padding:10px}.summary{background:#fff;border-radius:14px;padding:10px 12px;border:1px solid #efdce8;display:flex;gap:10px;align-items:center;margin-bottom:9px}
.big{font-weight:800;font-size:17px;white-space:nowrap}.rate{font-weight:800;white-space:nowrap}.bar{height:7px;background:#eee5ea;border-radius:9px;overflow:hidden;flex:1}.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#ff5d9e,#8e79df)}
.controls{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:9px}input,button,select{font:inherit;border:1px solid #ead8e3;background:#fff;border-radius:9px;padding:8px 10px}input{flex:1;min-width:170px}button{cursor:pointer}.active{background:#ffe0ed;border-color:#ff8bb9;color:#bd2d68;font-weight:800}
.hint{font-size:11px;color:#827580;margin:8px 2px 12px}.grid{display:grid;grid-template-columns:repeat(6,1fr);gap:9px}
.card{background:#fff;border:2px solid transparent;border-radius:11px;overflow:hidden;cursor:pointer;position:relative;box-shadow:0 2px 10px #643b520d}.card.owned{border-color:#4fc58f;box-shadow:0 0 0 2px #4fc58f33}
.pic{aspect-ratio:3/4;background:#f0e8ed;position:relative;overflow:hidden}.pic img{width:100%;height:100%;object-fit:cover;display:block}
.fallback{display:none;position:absolute;inset:0;align-items:center;justify-content:center;text-align:center;color:#887987;font-weight:800;font-size:13px;padding:5px}
.check{position:absolute;right:6px;bottom:6px;width:29px;height:29px;border-radius:50%;background:#fff;color:#19a66e;display:none;align-items:center;justify-content:center;font-weight:900;font-size:20px;box-shadow:0 2px 8px #0002}.owned .check{display:flex}
.tag{position:absolute;left:5px;top:5px;background:#ffffffe8;border-radius:9px;padding:3px 6px;font-size:9px;font-weight:900}.num{position:absolute;right:5px;top:5px;background:#322b37dd;color:#fff;border-radius:5px;padding:3px 5px;font-size:8px}
.label{text-align:center;font-size:9px;font-weight:800;padding:6px}.note{font-size:10px;color:#918391;text-align:center;padding:20px 5px 30px;line-height:1.6}
@media(max-width:700px){.grid{grid-template-columns:repeat(4,1fr);gap:6px}}@media(max-width:430px){.grid{grid-template-columns:repeat(3,1fr);gap:6px}.big{font-size:15px}}
</style></head><body>
<header><h1>✦ アイカツ！アンコール</h1><div class="sub">1弾・カード画像コレクション管理</div></header>
<main><div class="summary"><div class="big"><span id="owned">0</span> / 85枚</div><div class="bar"><i id="bar"></i></div><div class="rate" id="rate">0%</div></div>
<div class="controls"><input id="q" type="search" placeholder="カード番号を検索（E1-51など）">
<button class="active" data-mode="all">すべて</button><button data-mode="owned">所持</button><button data-mode="missing">未所持</button>
<select id="rarity"><option value="">レアリティ：すべて</option><option>PR</option><option>R</option><option>N</option><option>ER</option></select></div>
<div class="hint">カード画像をタップすると「所持 ✓」に切り替わります。もう一度タップすると未所持に戻ります。</div>
<section id="grid" class="grid"></section>
<div class="note">カード画像は「データカードダス アイカツ！アンコール」公式カードリストの画像URLを参照しています。<br>公式カードリストの1弾掲載枚数：85枚</div></main>
<script>
const cards=[{"id": "E1-01", "rare": "PR", "num": 1}, {"id": "E1-02", "rare": "PR", "num": 2}, {"id": "E1-03", "rare": "PR", "num": 3}, {"id": "E1-04", "rare": "PR", "num": 4}, {"id": "E1-05", "rare": "R", "num": 5}, {"id": "E1-06", "rare": "R", "num": 6}, {"id": "E1-07", "rare": "R", "num": 7}, {"id": "E1-08", "rare": "R", "num": 8}, {"id": "E1-09", "rare": "R", "num": 9}, {"id": "E1-10", "rare": "R", "num": 10}, {"id": "E1-11", "rare": "R", "num": 11}, {"id": "E1-12", "rare": "R", "num": 12}, {"id": "E1-13", "rare": "R", "num": 13}, {"id": "E1-14", "rare": "R", "num": 14}, {"id": "E1-15", "rare": "R", "num": 15}, {"id": "E1-16", "rare": "R", "num": 16}, {"id": "E1-17", "rare": "R", "num": 17}, {"id": "E1-18", "rare": "R", "num": 18}, {"id": "E1-19", "rare": "R", "num": 19}, {"id": "E1-20", "rare": "R", "num": 20}, {"id": "E1-21", "rare": "N", "num": 21}, {"id": "E1-22", "rare": "N", "num": 22}, {"id": "E1-23", "rare": "N", "num": 23}, {"id": "E1-24", "rare": "N", "num": 24}, {"id": "E1-25", "rare": "N", "num": 25}, {"id": "E1-26", "rare": "N", "num": 26}, {"id": "E1-27", "rare": "N", "num": 27}, {"id": "E1-28", "rare": "N", "num": 28}, {"id": "E1-29", "rare": "N", "num": 29}, {"id": "E1-30", "rare": "ER", "num": 30}, {"id": "E1-31", "rare": "ER", "num": 31}, {"id": "E1-32", "rare": "ER", "num": 32}, {"id": "E1-33", "rare": "PR", "num": 33}, {"id": "E1-34", "rare": "PR", "num": 34}, {"id": "E1-35", "rare": "PR", "num": 35}, {"id": "E1-36", "rare": "PR", "num": 36}, {"id": "E1-37", "rare": "R", "num": 37}, {"id": "E1-38", "rare": "R", "num": 38}, {"id": "E1-39", "rare": "R", "num": 39}, {"id": "E1-40", "rare": "R", "num": 40}, {"id": "E1-41", "rare": "N", "num": 41}, {"id": "E1-42", "rare": "N", "num": 42}, {"id": "E1-43", "rare": "N", "num": 43}, {"id": "E1-44", "rare": "N", "num": 44}, {"id": "E1-45", "rare": "N", "num": 45}, {"id": "E1-46", "rare": "N", "num": 46}, {"id": "E1-47", "rare": "N", "num": 47}, {"id": "E1-48", "rare": "N", "num": 48}, {"id": "E1-49", "rare": "N", "num": 49}, {"id": "E1-50", "rare": "ER", "num": 50}, {"id": "E1-51", "rare": "PR", "num": 51}, {"id": "E1-52", "rare": "PR", "num": 52}, {"id": "E1-53", "rare": "R", "num": 53}, {"id": "E1-54", "rare": "R", "num": 54}, {"id": "E1-55", "rare": "R", "num": 55}, {"id": "E1-56", "rare": "R", "num": 56}, {"id": "E1-57", "rare": "R", "num": 57}, {"id": "E1-58", "rare": "R", "num": 58}, {"id": "E1-59", "rare": "R", "num": 59}, {"id": "E1-60", "rare": "N", "num": 60}, {"id": "E1-61", "rare": "N", "num": 61}, {"id": "E1-62", "rare": "N", "num": 62}, {"id": "E1-63", "rare": "N", "num": 63}, {"id": "E1-64", "rare": "N", "num": 64}, {"id": "E1-65", "rare": "N", "num": 65}, {"id": "E1-66", "rare": "N", "num": 66}, {"id": "E1-67", "rare": "N", "num": 67}, {"id": "E1-68", "rare": "N", "num": 68}, {"id": "E1-69", "rare": "N", "num": 69}, {"id": "E1-70", "rare": "N", "num": 70}, {"id": "E1-71", "rare": "PR", "num": 71}, {"id": "E1-72", "rare": "PR", "num": 72}, {"id": "E1-73", "rare": "PR", "num": 73}, {"id": "E1-74", "rare": "PR", "num": 74}, {"id": "E1-75", "rare": "PR", "num": 75}, {"id": "E1-76", "rare": "PR", "num": 76}, {"id": "E1-77", "rare": "PR", "num": 77}, {"id": "E1-78", "rare": "PR", "num": 78}, {"id": "E1-79", "rare": "PR", "num": 79}, {"id": "E1-80", "rare": "PR", "num": 80}, {"id": "E1-81", "rare": "PR", "num": 81}, {"id": "E1-82", "rare": "PR", "num": 82}, {"id": "E1-83", "rare": "N", "num": 83}, {"id": "E1-84", "rare": "N", "num": 84}, {"id": "E1-85", "rare": "N", "num": 85}];const key="aikatsu-encore-owned-v3";let owned=JSON.parse(localStorage.getItem(key)||"{}"),mode="all";
const img=c=>"https://dcd.aikatsu.com/encore/images/cardlist/card/"+c.id+"_"+c.rare+".webp";
function toggle(id){owned[id]=!owned[id];if(!owned[id])delete owned[id];localStorage.setItem(key,JSON.stringify(owned));render()}
function render(){
 const q=document.getElementById("q").value.trim().toUpperCase(),r=document.getElementById("rarity").value;
 const list=cards.filter(c=>(!q||c.id.includes(q))&&(!r||c.rare===r)&&(mode==="all"||(mode==="owned"?owned[c.id]:!owned[c.id])));
 document.getElementById("grid").innerHTML=list.map(c=>`<article class="card ${owned[c.id]?"owned":""}" onclick="toggle('${c.id}')"><div class="pic"><img src="${img(c)}" alt="${c.id}" loading="lazy" onerror="this.style.display='none';this.nextElementSibling.style.display='flex'"><div class="fallback">${c.id}<br>画像を表示できません</div><span class="tag">${c.rare}</span><span class="num">#${c.num}</span><span class="check">✓</span></div><div class="label">${c.id}</div></article>`).join("");
 const n=Object.keys(owned).filter(id=>owned[id]).length,p=Math.round(n/85*100);document.getElementById("owned").textContent=n;document.getElementById("rate").textContent=p+"%";document.getElementById("bar").style.width=p+"%";
}
document.querySelectorAll("[data-mode]").forEach(b=>b.onclick=()=>{mode=b.dataset.mode;document.querySelectorAll("[data-mode]").forEach(x=>x.classList.toggle("active",x===b));render()});
document.getElementById("q").oninput=render;document.getElementById("rarity").onchange=render;render();
</script></body></html>
